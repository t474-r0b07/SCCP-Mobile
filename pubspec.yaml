name: sccp_mobile
description: Sistema de Control y Custodia Policial - App Móvil
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Estado
  provider: ^6.1.1
  
  # Backend
  supabase_flutter: ^2.0.0
  # Geolocalización
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  
  # Servicios en Background
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  android_alarm_manager_plus: ^4.0.8
  
  # Notificaciones
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  
  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Batería
  battery_plus: ^5.0.2
  
  # Audio
  audioplayers: ^5.2.1
  speech_to_text: ^7.3.0
  record: ^6.1.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  network_info_plus: ^6.1.4
  flutter_blue_plus: ^1.35.5
  image_picker: ^1.1.2
  
  # Sensores
  sensors_plus: ^4.0.2
  
  # Utils
  android_id: ^0.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  flutter_webrtc: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/maps/
  
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/icons/SCCPapp.png
  min_sdk_android: 21
